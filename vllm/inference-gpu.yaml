apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: inference
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: compute-csi-default-sc
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 2400
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Avoid VLLM_PORT from Kubernetes Service links conflicting with vLLM's settings.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: download-model
          # v0.29.0; reuse the CUDA image for downloading and serving.
          image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
          command: [python3, -u, -c]
          args:
            - |
              from pathlib import Path
              from huggingface_hub import snapshot_download

              revision = "c1899de289a04d12100db370d81485cdf75e47ca"
              target = Path("/models/qwen3-0.6b") / revision
              marker = target / ".download-complete"
              if marker.exists():
                  print(f"Reusing complete model revision {revision} at {target}")
              else:
                  print(f"Downloading Qwen/Qwen3-0.6B revision {revision}")
                  snapshot_download(
                      repo_id="Qwen/Qwen3-0.6B",
                      revision=revision,
                      local_dir=str(target),
                      allow_patterns=["*.json", "*.safetensors", "*.txt", "*.model", "*.jinja", "*.tiktoken"],
                  )
                  marker.write_text(revision + "\n")
                  print(f"Model download complete: {target}")
          env:
            - name: HF_HOME
              value: /models/.huggingface
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
          command: [vllm, serve]
          args:
            - /models/qwen3-0.6b/c1899de289a04d12100db370d81485cdf75e47ca
            - --served-model-name
            - qwen3-0.6b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --gpu-memory-utilization
            - "0.25"
            - --max-model-len
            - "2048"
            - --max-num-seqs
            - "2"
            - --enforce-eager
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HOME
              value: /tmp/huggingface
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "12"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "14"
              memory: 20Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
