apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-benchmark
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: inference-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /benchmark/v1/chat/completions
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: qwen
